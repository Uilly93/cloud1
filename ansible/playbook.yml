---
- name: Configure EC2 for Inception
  hosts: cloud1
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - git
          - curl
          - make
          - vim
          - unzip
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Clone repository
      git:
        repo: "https://github.com/Uilly93/cloud1Inception.git"
        dest: /opt/inception
        update: yes

    - name: Make build
      shell: |
        export PUB_IP=$(curl https://checkip.amazonaws.com)
        cd /opt/inception/Inception
        make